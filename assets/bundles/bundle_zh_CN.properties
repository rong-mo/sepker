# ==================== 星球 ====================
planet.黄队的奇妙大冒险-sepker.name=赛普克尔
planet.黄队的奇妙大冒险-sepker.description=冒险主星球

# ==================== 扇区 ====================
sector.黄队的奇妙大冒险-sepkerMain1.name=边陲废墟
sector.黄队的奇妙大冒险-sepkerMain1.description=作为反攻的第一站，我们的侦察兵发现此地好像年久失修，或许可以利用这一点。。。。。。\n将会有一支先头小队支援你们。
sector.黄队的奇妙大冒险-sepkerMain2.name=沙漠之心
sector.黄队的奇妙大冒险-sepkerMain2.description=敌人的沙漠采油厂\n占领这里就可以获得大量的燃料。\n\n[yellow]“为什么敌方的巡航导弹基地增多了。。。”

sector.黄队的奇妙大冒险-sepkerMain3.name=侵蚀洞窟
sector.黄队的奇妙大冒险-sepkerMain3.description=先头部队发现了一个神秘的洞窟，在其中发现了敌方一处较大的秘密基地
sector.黄队的奇妙大冒险-sepkerMain4.name=遥远的桥
sector.黄队的奇妙大冒险-sepkerMain4.description=先头部队（S星）大部分正在牵制敌方\n总部要求大部队绕后敌袭\nE星资源几乎无限供应\n尝试使用S星资源升级供应通道

# ==================== 科技树 ====================
techtree.sepker-combined=赛普克尔

# ==================== 物品 ====================
item.黄队的奇妙大冒险-uranium.name=铀
item.黄队的奇妙大冒险-uranium.description=高放射性矿物，极其危险。
item.黄队的奇妙大冒险-uranium-stick.name=铀棒
item.黄队的奇妙大冒险-uranium-stick.description=提纯后的铀，可用于裂变产电。
item.黄队的奇妙大冒险-depleted-uranium.name=贫铀
item.黄队的奇妙大冒险-depleted-uranium.description=脱贫后的铀，极具放射性但基本稳定。

# ==================== 液体 ====================
liquid.黄队的奇妙大冒险-steam.name=蒸汽
liquid.黄队的奇妙大冒险-steam.description=高温高压蒸汽。

# ==================== 状态效果 ====================
status.黄队的奇妙大冒险-sepker-radiation.name=辐射
status.黄队的奇妙大冒险-sepker-radiation.description=受到辐射伤害，每秒失去 480 点生命值。

# ==================== 方块 ====================
block.黄队的奇妙大冒险-sepker-xu-and-mo.name=许与墨
block.黄队的奇妙大冒险-sepker-xu-and-mo.description=赛普克尔星球的核心。
block.黄队的奇妙大冒险-sepker-blue-glow.name=蓝辉
block.黄队的奇妙大冒险-sepker-blue-glow.description=浅蓝色激光炮，发射激光并麻痹敌人。
block.黄队的奇妙大冒险-sepker-storm.name=风暴
block.黄队的奇妙大冒险-sepker-storm.description=风暴：单管机炮。发射高爆穿甲弹，对空对地，造成大范围爆炸与击退。
block.黄队的奇妙大冒险-sepker-missile-launcher.name=垂发导弹系统
block.黄队的奇妙大冒险-sepker-missile-launcher.description=垂直发射导弹，导弹沿弹道飞行后命中目标区域。
block.黄队的奇妙大冒险-sepker-antiair-launcher.name=防空导弹系统
block.黄队的奇妙大冒险-sepker-antiair-launcher.description=发射高强度防空导弹，最好用于反导，反空军时范围会降低。
block.黄队的奇妙大冒险-sepker-nuclear-reactor.name=核反应堆
block.黄队的奇妙大冒险-sepker-nuclear-reactor.description=利用高纯铀棒裂变产生巨量电力，需要冷冻液，需要大量水，水与运行效率有关。
block.黄队的奇妙大冒险-sepker-industrial-turbine.name=工业涡轮
block.黄队的奇妙大冒险-sepker-industrial-turbine.description=工业级涡轮，通过离心快速将蒸汽变为水。
block.黄队的奇妙大冒险-sepker-uranium-wall.name=铀墙
block.黄队的奇妙大冒险-sepker-uranium-wall.description=保护己方建筑，利用相织布特性，铀的放射性强化原盾墙，吸收绝大部分炮弹，反射效率更高，创建一个力场。
block.黄队的奇妙大冒险-sepker-large-uranium-wall.name=大型铀墙
block.黄队的奇妙大冒险-sepker-large-uranium-wall.description=铀墙的加强版：更高的生命、护甲、护盾与反射效率。
block.黄队的奇妙大冒险-sepker-combat-factory.name=综合陆军工厂
block.黄队的奇妙大冒险-sepker-combat-factory.description=可制造所有陆地 T1 单位（含原版与自定义）。
block.黄队的奇妙大冒险-sepker-sea-air-factory.name=综合海空工厂
block.黄队的奇妙大冒险-sepker-sea-air-factory.description=可建造所有海军、空军 T1 单位。
block.黄队的奇妙大冒险-sepker-small-airport.name=小型机场
block.黄队的奇妙大冒险-sepker-small-airport.description=捕获、存放、起飞飞机。库存 10 架。
block.黄队的奇妙大冒险-sepker-warp-conveyor.name=亚空间运输传送带
block.黄队的奇妙大冒险-sepker-warp-conveyor.description=打包物品进行运输。利用亚空间进行传输，可以用电力加速，可以传导电力，可以串联，极其脆弱。
block.黄队的奇妙大冒险-shock-drill.name=震爆钻头
block.黄队的奇妙大冒险-shock-drill.description=能挖掘所有矿物。
block.黄队的奇妙大冒险-uranium-purification-factory.name=铀提纯工厂
block.黄队的奇妙大冒险-uranium-purification-factory.description=将铀提纯为铀棒。
block.黄队的奇妙大冒险-sepker-phase-depleter.name=相织脱贫器
block.黄队的奇妙大冒险-sepker-phase-depleter.description=利用铀，快速生产相织布，并产生贫铀。
block.黄队的奇妙大冒险-sepker-large-cryofluid-mixer.name=大型冷冻液混合器
block.黄队的奇妙大冒险-sepker-large-cryofluid-mixer.description=利用铀，强力的将钛混合进水中。
block.黄队的奇妙大冒险-sepker-uranium-ore.name=铀矿
block.黄队的奇妙大冒险-sepker-uranium-ore.description=天然铀矿沉积层。
block.黄队的奇妙大冒险-sepker-em-railgun.name=I 型磁轨炮
block.黄队的奇妙大冒险-sepker-em-railgun.description=快速抛射大量子弹，对近处敌人造成毁灭性打击
block.黄队的奇妙大冒险-sepker-em-railgun-2.name=II 型磁轨炮
block.黄队的奇妙大冒险-sepker-em-railgun-2.description=利用电磁，将子弹加速到极高的速度发射出去，具有极大的范围与极大的穿透力
block.黄队的奇妙大冒险-sepker-combined-reconstructor.name=综合单位重构厂
block.黄队的奇妙大冒险-sepker-combined-reconstructor.description=重构，升级所有T2，配方太长放不下[doge]
# ==================== 单位 ====================
unit.黄队的奇妙大冒险-sepker-ju-yu.name=局域
unit.黄队的奇妙大冒险-sepker-ju-yu.description=战斗机，只能对空。
unit.黄队的奇妙大冒险-sepker-hong-wei.name=虹伟
unit.黄队的奇妙大冒险-sepker-hong-wei.description=轰炸机，只能对地。
unit.黄队的奇妙大冒险-sepker-chang-qiang.name=长枪
unit.黄队的奇妙大冒险-sepker-chang-qiang.description=海军主战舰，免疫潮湿。
unit.黄队的奇妙大冒险-sepker-zhi-hu.name=支护
unit.黄队的奇妙大冒险-sepker-zhi-hu.description=海军支援舰，能建造与修理，免疫潮湿。
unit.黄队的奇妙大冒险-sepker-qing-se.name=青涩
unit.黄队的奇妙大冒险-sepker-qing-se.description=自行火炮单位，有效打击敌方建筑。
unit.黄队的奇妙大冒险-sepker-rong-guang.name=荣光
unit.黄队的奇妙大冒险-sepker-rong-guang.description=重型支援单位，提供修复与状态场。
unit.黄队的奇妙大冒险-sepker-xu-jun.name=许君
unit.黄队的奇妙大冒险-sepker-xu-jun.description=指挥官单位。
unit.黄队的奇妙大冒险-sepker-fire-support-jet.name=火力支援机
unit.黄队的奇妙大冒险-sepker-fire-support-jet.description=火力支援。请在世界处理器中使用火力支援指令。

