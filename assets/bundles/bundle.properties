unit.黄队的奇妙大冒险-sepker-chang-qiang.description=Main naval battleship. Immune to wet.
unit.黄队的奇妙大冒险-sepker-zhi-hu.name=Support
unit.黄队的奇妙大冒险-sepker-zhi-hu.description=Naval support ship. Can build and repair. Immune to wet.
unit.黄队的奇妙大冒险-sepker-qing-se.name=Verdant
unit.黄队的奇妙大冒险-sepker-qing-se.description=Self-propelled artillery. Effective against enemy buildings.
unit.黄队的奇妙大冒险-sepker-rong-guang.name=Glory
unit.黄队的奇妙大冒险-sepker-rong-guang.description=Heavy support unit. Provides repair and status field.
unit.黄队的奇妙大冒险-sepker-xu-jun.name=Xu Jun
unit.黄队的奇妙大冒险-sepker-xu-jun.description=Commander unit.
unit.黄队的奇妙大冒险-sepker-fire-support-jet.name=Fire Support Jet
unit.黄队的奇妙大冒险-sepker-fire-support-jet.description=Fire support. Use the Fire Support instruction in world processors.

