# ==================== 星球 ====================
planet.黄队的奇妙大冒险-sepker.name=Sepker
planet.黄队的奇妙大冒险-sepker.description=Main planet

# ==================== 扇区 ====================
sector.黄队的奇妙大冒险-sepkerMain1.name=Border Ruins
sector.黄队的奇妙大冒险-sepkerMain1.description=As the first stop of the counterattack, our scouts found this place long neglected. Perhaps that can be turned to our advantage...\nA vanguard squad will be sent to support you.
sector.黄队的奇妙大冒险-sepkerMain2.name=Desert Heart
sector.黄队的奇妙大冒险-sepkerMain2.description=The enemy's desert oil extraction plant.\nSeize it to obtain a large amount of fuel.\n\n[yellow]"Why are there more enemy cruise missile bases..."
sector.黄队的奇妙大冒险-sepkerMain3.name=Erosion Cave
sector.黄队的奇妙大冒险-sepkerMain3.description=The vanguard discovered a mysterious cavern, and inside it found a fairly large secret enemy base.
sector.黄队的奇妙大冒险-sepkerMain4.name=Distant Bridge
sector.黄队的奇妙大冒险-sepkerMain4.description=Most of the vanguard (Planet S) is pinning the enemy down.\nHQ orders the main force to flank the enemy from behind.\nPlanet E's resources are almost unlimited in supply.\nTry using Planet S's resources to upgrade the supply channel.

# ==================== 科技树 ====================
techtree.sepker-combined=Sepker

# ==================== 物品 ====================
item.黄队的奇妙大冒险-uranium.name=Uranium
item.黄队的奇妙大冒险-uranium.description=Highly radioactive mineral. Extremely dangerous.
item.黄队的奇妙大冒险-uranium-stick.name=Uranium Rod
item.黄队的奇妙大冒险-uranium-stick.description=Purified uranium. Used for fission power generation.
item.黄队的奇妙大冒险-depleted-uranium.name=Depleted Uranium
item.黄队的奇妙大冒险-depleted-uranium.description="Depleted" uranium. Extremely radioactive, yet basically stable.

# ==================== 液体 ====================
liquid.黄队的奇妙大冒险-steam.name=Steam
liquid.黄队的奇妙大冒险-steam.description=High-temperature, high-pressure steam.

# ==================== 状态效果 ====================
status.黄队的奇妙大冒险-sepker-radiation.name=Radiation
status.黄队的奇妙大冒险-sepker-radiation.description=Radiation damage. Loses 480 HP per second.

# ==================== 方块 ====================
block.黄队的奇妙大冒险-sepker-xu-and-mo.name=Xu and Mo
block.黄队的奇妙大冒险-sepker-xu-and-mo.description=Core of the Sepker planet.
block.黄队的奇妙大冒险-sepker-blue-glow.name=Blue Glow
block.黄队的奇妙大冒险-sepker-blue-glow.description=Pale blue laser cannon. Fires lasers that paralyze enemies.
block.黄队的奇妙大冒险-sepker-storm.name=Storm
block.黄队的奇妙大冒险-sepker-storm.description=Storm: Single-barrel autocannon. Fires high-explosive armor-piercing rounds against air and ground, causing large explosions and knockback.
block.黄队的奇妙大冒险-sepker-missile-launcher.name=Vertical Launch Missile System
block.黄队的奇妙大冒险-sepker-missile-launcher.description=Vertically launched missiles that follow ballistic trajectories before hitting the target area.
block.黄队的奇妙大冒险-sepker-antiair-launcher.name=Anti-Air Missile System
block.黄队的奇妙大冒险-sepker-antiair-launcher.description=Launches high-intensity anti-air missiles. Best used for anti-missile defense; effective range is reduced against aircraft.
block.黄队的奇妙大冒险-sepker-nuclear-reactor.name=Nuclear Reactor
block.黄队的奇妙大冒险-sepker-nuclear-reactor.description=Uses high-purity uranium rods for fission to produce massive power. Requires cryofluid and a large amount of water. Water affects efficiency.
block.黄队的奇妙大冒险-sepker-industrial-turbine.name=Industrial Turbine
block.黄队的奇妙大冒险-sepker-industrial-turbine.description=Industrial-grade turbine. Rapidly converts steam back into water via centrifugation.
block.黄队的奇妙大冒险-sepker-uranium-wall.name=Uranium Wall
block.黄队的奇妙大冒险-sepker-uranium-wall.description=Protects friendly structures. Based on phase fabric tech, enhanced by uranium's radioactivity. Absorbs most shells; deflected shells increase reflect efficiency. Creates a force field.
block.黄队的奇妙大冒险-sepker-large-uranium-wall.name=Large Uranium Wall
block.黄队的奇妙大冒险-sepker-large-uranium-wall.description=An upgraded Uranium Wall with higher health, armor, shield, and reflect efficiency.
block.黄队的奇妙大冒险-sepker-combat-factory.name=Combined Ground Factory
block.黄队的奇妙大冒险-sepker-combat-factory.description=Produces all ground T1 units, including vanilla and custom.
block.黄队的奇妙大冒险-sepker-sea-air-factory.name=Combined Sea-Air Factory
block.黄队的奇妙大冒险-sepker-sea-air-factory.description=Produces all naval and air T1 units.
block.黄队的奇妙大冒险-sepker-small-airport.name=Small Airport
block.黄队的奇妙大冒险-sepker-small-airport.description=Captures, stores, and launches aircraft. Capacity: 10.
block.黄队的奇妙大冒险-sepker-warp-conveyor.name=Warp Conveyor
block.黄队的奇妙大冒险-sepker-warp-conveyor.description=Packs items for transport. Uses subspace for transmission. Can be boosted with power, conducts power, and can be chained. Extremely fragile.
block.黄队的奇妙大冒险-shock-drill.name=Shock Drill
block.黄队的奇妙大冒险-shock-drill.description=Can mine all ores.
block.黄队的奇妙大冒险-uranium-purification-factory.name=Uranium Purification Factory
block.黄队的奇妙大冒险-uranium-purification-factory.description=Purifies uranium into uranium rods.
block.黄队的奇妙大冒险-sepker-phase-depleter.name=Phase Depleter
block.黄队的奇妙大冒险-sepker-phase-depleter.description=Uses uranium to rapidly produce phase fabric, leaving depleted uranium behind.
block.黄队的奇妙大冒险-sepker-large-cryofluid-mixer.name=Large Cryofluid Mixer
block.黄队的奇妙大冒险-sepker-large-cryofluid-mixer.description=Uses uranium to forcefully mix titanium into water.
block.黄队的奇妙大冒险-sepker-uranium-ore.name=Uranium Ore
block.黄队的奇妙大冒险-sepker-uranium-ore.description=Natural uranium ore deposit.
block.黄队的奇妙大冒险-sepker-em-railgun.name=Type I railgun
block.黄队的奇妙大冒险-sepker-em-railgun.description=It can quickly fire a large number of bullets and deal a devastating blow to nearby enemies.
block.黄队的奇妙大冒险-sepker-em-railgun-2.name=Type II railgun
block.黄队的奇妙大冒险-sepker-em-railgun-2.description=By using electromagnetism, the bullet is accelerated to an extremely high speed and fired out, which has a great range and great penetrating power
block.黄队的奇妙大冒险-sepker-combined-reconstructor.name=combined unit reconstructor
block.黄队的奇妙大冒险-sepker-combined-reconstructor.description=reconsitution/up all T1 units.

